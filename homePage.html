<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>

<body>
    <div class="navbar">
        <img src="/images/email_icon_-removebg.png" alt="email_icon">
        <div class="options">
            <a href="homePage.html">Home</a>
            <a href="#">Our-Services</a>
            <a href="#">Contact</a>
        </div>
        <div class = "logins">
            <a href="#">Login</a>
        </div>
    </div>

                <div class = "register">
                    <label>Don't have account yet? <a href="registerPage.html" class = "open-popup">Register</a></label>
                </div>

    </div>

<script src = "email_sender.js">

</script>
