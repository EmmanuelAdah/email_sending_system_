<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>email_sending_management</title>
    <link rel="stylesheet" href="homePage.css">
</head>

<body>
    <div class="navbar">
        <img src="/images/email_icon_-removebg.png" alt="email_icon">
        <div class="options">
            <a href="homePage.html">Home</a>
            <a href="#">Our-Services</a>
            <a href="#">Contact</a>
        </div>
        <div class = "logins">
            <a href="#">Login</a>
        </div>
    </div>

    <div class="message">
        <div>
            <h1>Deliver better &<br>Fast bulk emails</h1>
            <h3>We help you build a better organization</h3>
            <h3>by improving your information system.</h3>
            <h2>Remember, information is key...</h2>
        </div>

        <div class = "user-login">
            <h2>Welcome back</h2>
            <p>Enter your login details</p>
            <form onsubmit=" login(); return false">
                <input type = "text" id = "username" placeholder="Username" name = "username" required>
                <input type = "text" id = "password" placeholder="Password" name = "password" required>
                <div class = "register">
                    <label>Don't have account yet? <a onclick = "openPopUp()">Register</a></label>
                    <div class = "pop-up" id = "pop-up">
                        <a href="" onclick="closePopUp()"><img src="./images/close-outline.svg" alt=""></a>
                        <h3>Enter your details</h3>
                        <div class = "register-form">
                            <input type="text" name="firstname" id="firstname" placeholder="Firstname" required>
                            <input type="text" name="lastname" id="lastname" placeholder="Lastname" required>
                            <input type="text" name="email" id="email" placeholder="Email" required>
                            <input type="text" name="username" id="user-name" placeholder="Username" required>
                            <input type="text" name="password" id="pass-word" placeholder="Password" required>
                            <button type="submit">Submit</button>
                        </div>
                    </div>
                </div>
                <button type="submit" >Login</button>
            </form>
        </div>

    </div>

<script src = "email_sender.js">
    let popUp = document.getElementsByClassName(".pop-up");

    function openPopUp(){
        popUp.classList.add("open-popup");
    }

    function closePopUp(){
        popUp.classList.remove("open-popup");
    }
</script>
</body>
</html>
